# Pre-commit hooks for this R Shiny app template.
# Setup:  pip install pre-commit  &&  pre-commit install
# Run on everything:  pre-commit run --all-files
# Docs: https://pre-commit.com / https://lorenzwalthert.github.io/precommit/

# Generated/vendored paths that hooks should never touch.
exclude: "^(renv/|data/|docs/)"

repos:
  # R code formatting with air (matches air.toml; same formatter rstudio/shiny uses).
  - repo: https://github.com/posit-dev/air-pre-commit
    rev: 0.10.0
    hooks:
      - id: air-format

  # R safety checks. lintr and parsability are enforced in CI (.github/
  # workflows/ci.yaml); these local checks use pygrep so they need no R
  # install (the lorenzwalthert/precommit hooks build their own R env, which
  # fails on R-devel toolchains without prebuilt binaries).
  - repo: local
    hooks:
      - id: no-browser-statement
        name: no browser() statements
        entry: 'browser\('
        language: pygrep
        files: '\.R$'
      - id: no-debug-statement
        name: no debug()/debugonce() statements
        entry: '\bdebug(once)?\('
        language: pygrep
        files: '\.R$'
      - id: no-print-statement
        name: no print() statements
        entry: '\bprint\('
        language: pygrep
        files: '\.R$'
        exclude: "^dev/"

  # Generic hygiene.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: check-added-large-files
        args: ["--maxkb=2000"]
      - id: check-yaml
      - id: check-merge-conflict
      # Block obvious secrets from being committed.
      - id: detect-private-key

  # Secret scanning: catch tokens, keys, and credentials before they land.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Catch common spelling mistakes in code and docs.
  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        args: ["--ignore-words-list=ans,fo"]
        # Skip the generated dependency files (author/package names such as
        # "Claus" and "deSolve") and the boilerplate code of conduct.
        exclude: "^(renv\\.lock|manifest\\.json|CODE_OF_CONDUCT\\.md)$"
