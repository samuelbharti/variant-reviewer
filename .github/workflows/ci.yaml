# Continuous integration for the Shiny app template.
# Runs on every push/PR to the main development branches.
#
# Jobs:
#   lint     - static analysis of R source with {lintr} (config in .lintr)
#   format   - verifies R code is formatted with air (config in air.toml)
#   app      - installs dependencies and runs the shinytest2 smoke test
#   markdown - lints Markdown files (config in .markdownlint.json)
on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

name: CI

permissions: read-all

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      # Restore from renv.lock, the same source of truth `renv::restore()`
      # uses locally, so CI always has exactly what the app currently depends
      # on -- rather than a hand-maintained package list that silently drifts
      # out of date as dependencies are added (which is how r3dmol and
      # biobouncer went missing from CI while still being used by the app).
      #
      # Trade-off: unlike setup-r-dependencies' pak-based installer,
      # setup-renv does not auto-`apt-get` a package's system libraries, so a
      # future dependency needing one Posit Package Manager doesn't already
      # ship a binary for (use-public-rspm below covers everything currently
      # in renv.lock) would fail to build here. If that happens, add an
      # explicit sysreqs/apt-get step rather than reverting to a hand-listed
      # package set.
      - uses: r-lib/actions/setup-renv@v2
      # lintr is a CI-only tool, not a runtime dependency of the app, so it is
      # not part of renv.lock; add it on top of the restored library through
      # the same cached, binary-preferring installer the app job used to
      # install everything with, rather than a bare install.packages() call.
      # packages: must be overridden -- it defaults to "deps::., any::sessioninfo",
      # and deps::. resolves dependencies from a DESCRIPTION file, which this
      # project (an app, not a package) does not have.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::sessioninfo
          extra-packages: any::lintr
      - name: Lint
        run: |
          lints <- lintr::lint_dir(".")
          print(lints)
          if (length(lints) > 0) stop(sprintf("Found %d lint(s).", length(lints)))
        shell: Rscript {0}

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: posit-dev/setup-air@v1
      - name: Check formatting
        run: air format --check .

  app:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      # See the lint job above: restoring from renv.lock keeps this in step
      # with the app's actual dependencies (shinytest2 and testthat, used by
      # the smoke test below, are already recorded there too).
      - uses: r-lib/actions/setup-renv@v2
      - name: Run tests (app smoke test)
        run: shiny::runTests(".", assert = TRUE)
        shell: Rscript {0}

  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint markdown files
        uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: |
            **/*.md
            !renv
